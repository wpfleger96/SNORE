name: Production deps

# Kept out of ci.yml, which github-config overwrites on sync.  Imports the app
# from a `--no-dev` install so a runtime import satisfied only by a dev
# dependency fails here instead of in the Docker image.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: prod-deps-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

jobs:
  prod-import-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "latest"
          enable-cache: true

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Import app from a production-only install
        run: just prod-import-check
